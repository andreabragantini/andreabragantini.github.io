title: Contact
subtitle: Send me a message
permalink: /contact/
---

<div class="well" style="max-width: 760px; margin: 0 auto;">

  <form action="https://formspree.io/f/xjglqojj" method="POST" accept-charset="UTF-8">
    <input type="hidden" name="_subject" value="New message from andreabragantini.github.io">

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" class="form-control" rows="7" required></textarea>
    </div>

    <!-- Honeypot field for spam bots -->
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit" class="btn btn-primary">Send message</button>
  </form>
</div>
